<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Radar circles -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8" stroke-dasharray="6 10" />
  <circle cx="256" cy="270" r="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" />
  <circle cx="256" cy="270" r="60" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="8" />
  <!-- Center Alert Core -->
  <circle cx="256" cy="270" r="28" fill="url(#sosGrad)" />
  <circle cx="256" cy="270" r="14" fill="#ffffff" />
  <!-- Signal Waves Above -->
  <path d="M160 170 C210 120, 302 120, 352 170" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <path d="M190 200 C225 165, 287 165, 322 200" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <!-- Top badge -->
  <rect x="156" y="56" width="200" height="42" rx="21" fill="rgba(255,255,255,0.92)" />
  <text x="256" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="2">PIURA ALERTA</text>
</svg>
