<div class="page">
  <app-topbar>
    <span topbar-left class="topbar-brand">
      <span class="material-symbols-outlined">person</span>
      <span>Perfil</span>
    </span>
  </app-topbar>

  <main class="main">
    <section class="profile-header">
      <div class="avatar">
        <span class="material-symbols-outlined avatar-icon">account_circle</span>
      </div>
      <div class="profile-info">
        <h1 class="profile-name">{{ userProfile().name }}</h1>
        <p class="profile-location">{{ userProfile().location }}</p>
      </div>
    </section>

    <section class="contact-section">
      <div class="contact-card">
        <div class="contact-item">
          <span class="material-symbols-outlined contact-icon">mail</span>
          <div class="contact-content">
            <p class="contact-label">Correo electrónico</p>
            <p class="contact-value">{{ userProfile().email }}</p>
          </div>
        </div>
      </div>

      <div class="contact-card">
        <div class="contact-item">
          <span class="material-symbols-outlined contact-icon">phone</span>
          <div class="contact-content">
            <p class="contact-label">Teléfono</p>
            <p class="contact-value">{{ userProfile().phone }}</p>
          </div>
        </div>
      </div>

      <div class="contact-card">
        <div class="contact-item">
          <span class="material-symbols-outlined contact-icon">calendar_today</span>
          <div class="contact-content">
            <p class="contact-label">Se unió</p>
            <p class="contact-value">{{ userProfile().joinDate }}</p>
          </div>
        </div>
      </div>
    </section>

    <section class="menu-section">
      @for (item of menuItems(); track item.action) {
        <button
          class="menu-button"
          type="button"
          (click)="onMenuAction(item.action)"
          [class.logout-btn]="item.action === 'logout'"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span class="menu-label">{{ item.label }}</span>
          <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
        </button>
      }
    </section>
  </main>

  <app-bottom-nav></app-bottom-nav>
</div>
