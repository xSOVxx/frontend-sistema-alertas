<div class="page">
  <app-topbar>
    <a topbar-left class="back" routerLink="/feed">
      <span class="material-symbols-outlined">arrow_back</span>
      Alertas
    </a>
  </app-topbar>

  <main class="main">
    @if (loading()) {
      <p class="state">Cargando alerta...</p>
    }
    @if (error()) {
      <p class="state state--error" role="alert">{{ error() }}</p>
    }

    @if (alert(); as item) {
      <article class="alert-card" [attr.data-kind]="item.kind">
        <span class="badge">{{ item.label }}</span>
        <h1>{{ item.title }}</h1>
        <p class="date">{{ item.createdAt }}</p>
        <p class="content">{{ item.description }}</p>
        <div class="actions">
          <a class="primary" routerLink="/mapa" [queryParams]="{ alertId: item.id }">
            <span class="material-symbols-outlined">map</span>
            Ver en el mapa
          </a>
          <a class="secondary" routerLink="/feed">Volver al feed</a>
        </div>
      </article>
    }
  </main>

  <app-bottom-nav />
</div>
