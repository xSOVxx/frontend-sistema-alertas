<article
  class="card"
  [class.kind-roja]="alert().kind === 'roja'"
  [class.kind-precaucion]="alert().kind === 'precaucion'"
  [class.kind-informacion]="alert().kind === 'informacion'"
>
  <div class="card-stripe"></div>
  <div class="card-body" [class.card-body--image]="!!alert().image">
    <div class="card-head">
      <div class="card-kind">
        <span class="material-symbols-outlined filled">{{ alert().icon }}</span>
        <span class="card-kind-label">{{ alert().label }}</span>
      </div>
      <span class="card-time">{{ alert().createdAt }}</span>
    </div>
    <h3 class="card-title">{{ alert().title }}</h3>
    @if (alert().image) {
      <div class="card-image">
        <img [src]="alert().image" [alt]="alert().title" />
      </div>
    }
    @if (alert().description) {
      <p class="card-desc">{{ alert().description }}</p>
    }
    <div class="card-actions" [class.card-actions--mt]="!!alert().image">
      <button class="card-action" type="button" (click)="onAction()">
        <span class="material-symbols-outlined filled">{{ alert().actionIcon }}</span>
        {{ alert().actionLabel ?? 'Ver detalle' }}
      </button>

      <div class="share-group">
        <a
          [href]="getWhatsAppShareUrl()"
          target="_blank"
          rel="noopener noreferrer"
          class="share-link share-link--wa"
          title="Compartir en WhatsApp"
        >
          <span>WhatsApp</span>
        </a>
        <a
          [href]="getTelegramShareUrl()"
          target="_blank"
          rel="noopener noreferrer"
          class="share-link share-link--tg"
          title="Compartir en Telegram"
        >
          <span>Telegram</span>
        </a>
      </div>
    </div>
  </div>
</article>
